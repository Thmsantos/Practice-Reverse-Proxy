version: "3.9"

services:
  backend:
    build: ./backend
    container_name: app_um_backend
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/backend
    container_name: app_um_frontend
    ports:
      - "6050:5173"
    depends_on:
      - backend